<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Notification Management System</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--primary:#6d5dfc;--primary2:#8b5cf6;--dark:#15172b;--muted:#667085;--bg:#f6f7fb;}
*{box-sizing:border-box}
body{background:linear-gradient(135deg,#f7f5ff 0%,#f8fbff 52%,#f7f7fb 100%)!important;color:#171923;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
.navbar{background:linear-gradient(100deg,#17192f,#34306d)!important;box-shadow:0 8px 24px rgba(31,35,70,.16);}
.navbar-brand{font-weight:700;letter-spacing:.2px}
.card{border:0!important;border-radius:18px!important;box-shadow:0 14px 40px rgba(30,35,70,.10)!important;overflow:hidden}
.form-control,.form-select{border:1px solid #dfe3ef;border-radius:10px;padding:.72rem .85rem}
.form-control:focus,.form-select:focus{border-color:var(--primary);box-shadow:0 0 0 .2rem rgba(109,93,252,.13)}
.btn{border-radius:10px;font-weight:600;transition:.18s ease}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));border:0}
.btn-dark{background:#1d2038;border:0}
.text-muted{color:var(--muted)!important}
.badge{border-radius:999px;padding:.42em .7em}
</style>
<style>.hero{max-width:850px;margin:0 auto;padding:76px 20px}.hero-card{padding:54px 35px;background:rgba(255,255,255,.86);backdrop-filter:blur(10px)}.logo{width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,#6d5dfc,#8b5cf6);color:white;display:grid;place-items:center;font-size:30px;font-weight:800;margin:0 auto 22px;box-shadow:0 12px 28px rgba(109,93,252,.25)}.hero h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800}.hero p{font-size:1.05rem}</style></head><body><nav class="navbar navbar-dark"><div class="container"><span class="navbar-brand">🔔 Notification Management System</span></div></nav><main class="hero"><div class="card hero-card text-center"><div class="logo">N</div><h1>Smart Notifications, <span style="color:#6d5dfc">Simplified.</span></h1><p class="text-muted mb-4">Manage WhatsApp, Email and Web Push notifications from one place.</p><div><a href="/login/" class="btn btn-primary px-4 me-2">User Login</a><a href="/admin-dashboard/" class="btn btn-dark px-4">Admin Dashboard</a></div></div></main></body></html>
