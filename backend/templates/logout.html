<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Logout - Notification System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

<style>
:root{--primary:#6d5dfc;--primary2:#8b5cf6;--dark:#15172b;--muted:#667085;--bg:#f6f7fb;}
*{box-sizing:border-box}
body{background:linear-gradient(135deg,#f7f5ff 0%,#f8fbff 52%,#f7f7fb 100%)!important;color:#171923;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
.navbar{background:linear-gradient(100deg,#17192f,#34306d)!important;box-shadow:0 8px 24px rgba(31,35,70,.16);}
.navbar-brand{font-weight:700;letter-spacing:.2px}
.card{border:0!important;border-radius:18px!important;box-shadow:0 14px 40px rgba(30,35,70,.10)!important;overflow:hidden}
.form-control,.form-select{border:1px solid #dfe3ef;border-radius:10px;padding:.72rem .85rem}
.form-control:focus,.form-select:focus{border-color:var(--primary);box-shadow:0 0 0 .2rem rgba(109,93,252,.13)}
.btn{border-radius:10px;font-weight:600;transition:.18s ease}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));border:0}
.btn-dark{background:#1d2038;border:0}
.text-muted{color:var(--muted)!important}
.badge{border-radius:999px;padding:.42em .7em}
</style>
<style>.auth-wrap{min-height:calc(100vh - 64px);display:flex;align-items:center;padding:40px 15px}.logout-card{max-width:460px;margin:auto;padding:38px}.logout-icon{width:72px;height:72px;margin:0 auto 18px;border-radius:22px;background:#fff0f0;display:grid;place-items:center;font-size:32px}</style></head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <span class="navbar-brand">
            Notification Management System
        </span>
    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body p-4 text-center">

                    <h2 class="mb-3">
                        Logout
                    </h2>

                    <p class="text-muted">
                        Are you sure you want to logout?
                    </p>

                    <div id="message"></div>

                    <button
                        id="logoutButton"
                        class="btn btn-danger w-100"
                    >
                        Logout
                    </button>

                    <div class="mt-3">
                        <a href="/">
                            Back to Home
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

document.getElementById("logoutButton").addEventListener("click", async function () {

    const messageBox = document.getElementById("message");

    // Button disable while request is running
    const logoutButton = document.getElementById("logoutButton");
    logoutButton.disabled = true;
    logoutButton.innerText = "Logging out...";

    try {

        const response = await fetch("/api/logout/", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({})
        });


        const data = await response.json();


        if (response.ok && data.success === true) {

            messageBox.innerHTML = `
                <div class="alert alert-success">
                    ${data.message || "Logout successful."}
                </div>
            `;

        } else {

            messageBox.innerHTML = `
                <div class="alert alert-danger">
                    ${data.message || "Logout failed."}
                </div>
            `;

            logoutButton.disabled = false;
            logoutButton.innerText = "Logout";
        }


    } catch (error) {

        console.error("Logout Error:", error);

        messageBox.innerHTML = `
            <div class="alert alert-danger">
                Something went wrong. Please try again.
            </div>
        `;

        logoutButton.disabled = false;
        logoutButton.innerText = "Logout";
    }

});

</script>

</body>

</html>
