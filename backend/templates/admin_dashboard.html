<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Notification Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

<style>
:root{--primary:#6d5dfc;--primary2:#8b5cf6;--dark:#15172b;--muted:#667085;--bg:#f6f7fb;}
*{box-sizing:border-box}
body{background:linear-gradient(135deg,#f7f5ff 0%,#f8fbff 52%,#f7f7fb 100%)!important;color:#171923;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
.navbar{background:linear-gradient(100deg,#17192f,#34306d)!important;box-shadow:0 8px 24px rgba(31,35,70,.16);}
.navbar-brand{font-weight:700;letter-spacing:.2px}
.card{border:0!important;border-radius:18px!important;box-shadow:0 14px 40px rgba(30,35,70,.10)!important;overflow:hidden}
.form-control,.form-select{border:1px solid #dfe3ef;border-radius:10px;padding:.72rem .85rem}
.form-control:focus,.form-select:focus{border-color:var(--primary);box-shadow:0 0 0 .2rem rgba(109,93,252,.13)}
.btn{border-radius:10px;font-weight:600;transition:.18s ease}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));border:0}
.btn-dark{background:#1d2038;border:0}
.text-muted{color:var(--muted)!important}
.badge{border-radius:999px;padding:.42em .7em}
</style>
<style>.dashboard{padding-bottom:50px}.page-title h2{font-weight:800}.section-title{font-weight:750}.card-header-soft{background:linear-gradient(135deg,#f0edff,#f5f8ff);border-bottom:1px solid #eceef5;padding:18px 22px}.table{margin-bottom:0}.table thead th{border:0!important;padding:14px 12px}.table tbody td{padding:16px 12px;border-color:#edf0f6}.table-hover tbody tr:hover{background:#fafaff}.table-responsive{border-radius:14px;border:1px solid #edf0f6}.btn-info{background:#22b8cf;border-color:#22b8cf}.btn-warning{background:#f5b942;border-color:#f5b942}.navbar .btn{border-radius:9px}</style></head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <span class="navbar-brand">🔔 Notification Management System</span>

        <a href="/admin/" class="btn btn-outline-light btn-sm">
            Django Admin
        </a>

    </div>
</nav>


<div class="container mt-4 dashboard">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2>Notification Dashboard</h2>

            <p class="text-muted mb-0">
                Manage notification templates and channels
            </p>
        </div>

        <button
            class="btn btn-primary"
            onclick="loadTriggers()"
        >
            Refresh
        </button>

    </div>


    <div id="message"></div>


    <!-- CREATE TEMPLATE -->

    <div class="card shadow mb-4">

        <div class="card-body">

            <h4 class="mb-3">
                Create Notification Template
            </h4>

            <form id="createTemplateForm">

                <div class="mb-3">

                    <label class="form-label">
                        Trigger
                    </label>

                    <select
                        id="triggerId"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Trigger
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Channel
                    </label>

                    <select
                        id="channel"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Channel
                        </option>

                        <option value="whatsapp">
                            WhatsApp
                        </option>

                        <option value="email">
                            Email
                        </option>

                        <option value="web_push">
                            Web Push
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        class="form-control"
                        placeholder="Use this for Web Push"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        class="form-control"
                        placeholder="Use this for Email"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Message Body
                    </label>

                    <textarea
                        id="body"
                        class="form-control"
                        rows="4"
                        placeholder="Enter notification message"
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Template
                </button>

            </form>

        </div>

    </div>



    <!-- EDIT TEMPLATE -->

    <div
        class="card shadow mb-4 d-none"
        id="editCard"
    >

        <div class="card-body">

            <h4 class="mb-3">
                Edit Notification Template
            </h4>

            <form id="editTemplateForm">

                <input
                    type="hidden"
                    id="editTemplateId"
                >


                <div class="mb-3">

                    <label class="form-label">
                        Channel
                    </label>

                    <input
                        type="text"
                        id="editChannel"
                        class="form-control"
                        readonly
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Title
                    </label>

                    <input
                        type="text"
                        id="editTitle"
                        class="form-control"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="editSubject"
                        class="form-control"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Message Body
                    </label>

                    <textarea
                        id="editBody"
                        class="form-control"
                        rows="4"
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-success"
                >
                    Save Changes
                </button>


                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="cancelEdit()"
                >
                    Cancel
                </button>

            </form>

        </div>

    </div>



    <!-- TEST NOTIFICATION -->

    <div
        class="card shadow mb-4 d-none"
        id="testCard"
    >

        <div class="card-body">

            <h4 class="mb-3">
                Test Notification
            </h4>

            <form id="testNotificationForm">

                <input
                    type="hidden"
                    id="testTemplateId"
                >

                <input
                    type="hidden"
                    id="testChannel"
                >

                <div class="mb-3">
                    <label class="form-label">
                        Channel
                    </label>

                    <input
                        type="text"
                        id="testChannelDisplay"
                        class="form-control"
                        readonly
                    >
                </div>

                <div
                    class="mb-3 d-none"
                    id="phoneField"
                >
                    <label class="form-label">
                        WhatsApp Phone Number
                    </label>

                    <input
                        type="text"
                        id="testPhone"
                        class="form-control"
                        placeholder="Example: 919876543210"
                    >
                </div>

                <div
                    class="mb-3 d-none"
                    id="emailField"
                >
                    <label class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="testEmail"
                        class="form-control"
                        placeholder="Enter test email"
                    >
                </div>

                <div
                    class="mb-3 d-none"
                    id="subscriptionField"
                >
                    <label class="form-label">
                        OneSignal Subscription ID
                    </label>

                    <input
                        type="text"
                        id="testSubscriptionId"
                        class="form-control"
                        placeholder="Enter subscription ID"
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-success"
                >
                    Send Test Notification
                </button>

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="cancelTest()"
                >
                    Cancel
                </button>

            </form>

        </div>

    </div>


    <!-- NOTIFICATION TABLE -->

    <div class="card shadow">

        <div class="card-body">

            <h4 class="mb-3">
                Notification Triggers
            </h4>


            <div class="table-responsive">

                <table
                    class="table table-bordered table-hover align-middle"
                >

                    <thead class="table-dark">

                        <tr>

                            <th>
                                Trigger
                            </th>

                            <th>
                                WhatsApp
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Web Push
                            </th>

                        </tr>

                    </thead>


                    <tbody id="triggerTable">

                        <tr>

                            <td
                                colspan="4"
                                class="text-center"
                            >
                                Loading...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>



<script>

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.startsWith(name + "=")) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

const csrfToken = getCookie("csrftoken");


/* ================================
   LOAD TRIGGERS
================================ */

async function loadTriggers() {

    const table =
        document.getElementById("triggerTable");


    try {

        const response = await fetch(
            "/api/notifications/triggers/"
        );


        const triggers =
            await response.json();


        table.innerHTML = "";


        if (triggers.length === 0) {

            table.innerHTML = `
                <tr>
                    <td
                        colspan="4"
                        class="text-center"
                    >
                        No triggers found.
                    </td>
                </tr>
            `;

            return;
        }


        triggers.forEach(trigger => {

            const templates =
                trigger.templates || [];


            const whatsapp =
                templates.find(
                    template =>
                        template.channel === "whatsapp"
                );


            const email =
                templates.find(
                    template =>
                        template.channel === "email"
                );


            const webPush =
                templates.find(
                    template =>
                        template.channel === "web_push"
                );


            table.innerHTML += `

                <tr>

                    <td>

                        <strong>
                            ${trigger.name}
                        </strong>

                        <br>

                        <small class="text-muted">
                            ${trigger.description || "No description"}
                        </small>

                        <br>

                        ${
                            trigger.is_active

                            ? `
                                <span class="badge bg-success">
                                    Active
                                </span>
                            `

                            : `
                                <span class="badge bg-secondary">
                                    Inactive
                                </span>
                            `
                        }

                    </td>


                    <td>
                        ${renderChannel(whatsapp)}
                    </td>


                    <td>
                        ${renderChannel(email)}
                    </td>


                    <td>
                        ${renderChannel(webPush)}
                    </td>

                </tr>

            `;

        });


    } catch (error) {

        console.error(error);

        table.innerHTML = `
            <tr>
                <td
                    colspan="4"
                    class="text-center text-danger"
                >
                    Failed to load triggers.
                </td>
            </tr>
        `;

    }

}



/* ================================
   RENDER CHANNEL
================================ */

function renderChannel(template) {

    if (!template) {

        return `

            <div class="text-center">

                <span class="badge bg-secondary">
                    Not Created
                </span>

                <br><br>

                <button
                    class="btn btn-sm btn-primary"
                    onclick="scrollToCreateForm()"
                >
                    Create
                </button>

            </div>

        `;

    }


    return `

        <div>

            ${
                template.is_enabled

                ? `
                    <span class="badge bg-success">
                        Enabled
                    </span>
                `

                : `
                    <span class="badge bg-danger">
                        Disabled
                    </span>
                `
            }


            <div class="mt-2">

                <button
                    class="btn btn-sm btn-warning mb-1"
                    onclick="editTemplate(${template.id})"
                >
                    Edit
                </button>


                <button
                    class="btn btn-sm btn-secondary mb-1"
                    onclick="toggleTemplate(${template.id})"
                >

                    ${
                        template.is_enabled
                        ? "Disable"
                        : "Enable"
                    }

                </button>


                <button
                    class="btn btn-sm btn-info text-white mb-1"
                    onclick="testTemplate(
                        ${template.id},
                        '${template.channel}'
                    )"
                >
                    Test
                </button>

            </div>

        </div>

    `;

}



/* ================================
   CREATE TEMPLATE
================================ */

document
    .getElementById("createTemplateForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const triggerId =
                document.getElementById(
                    "triggerId"
                ).value;


            const channel =
                document.getElementById(
                    "channel"
                ).value;


            const title =
                document.getElementById(
                    "title"
                ).value;


            const subject =
                document.getElementById(
                    "subject"
                ).value;


            const body =
                document.getElementById(
                    "body"
                ).value;


            try {

                const response =
                    await fetch(
                        "/api/notifications/templates/",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",
                                "X-CSRFToken":
                                    csrfToken
                            },

                            body: JSON.stringify({

                                trigger:
                                    triggerId,

                                channel:
                                    channel,

                                title:
                                    title,

                                subject:
                                    subject,

                                body:
                                    body

                            })

                        }
                    );


                const data =
                    await response.json();


                if (response.ok) {

                    showMessage(
                        "Notification template created successfully.",
                        "success"
                    );


                    document
                        .getElementById(
                            "createTemplateForm"
                        )
                        .reset();


                    loadTriggers();

                } else {

                    showMessage(
                        JSON.stringify(data),
                        "danger"
                    );

                }


            } catch (error) {

                console.error(error);

                showMessage(
                    "Something went wrong while creating template.",
                    "danger"
                );

            }

        }
    );



/* ================================
   LOAD TRIGGER OPTIONS
================================ */

async function loadTriggerOptions() {

    const select =
        document.getElementById(
            "triggerId"
        );


    try {

        const response =
            await fetch(
                "/api/notifications/triggers/"
            );


        const triggers =
            await response.json();


        select.innerHTML = `
            <option value="">
                Select Trigger
            </option>
        `;


        triggers.forEach(trigger => {

            select.innerHTML += `
                <option value="${trigger.id}">
                    ${trigger.name}
                </option>
            `;

        });


    } catch (error) {

        console.error(error);

    }

}



/* ================================
   EDIT TEMPLATE
================================ */

async function editTemplate(templateId) {

    try {

        const response =
            await fetch(
                `/api/notifications/templates/${templateId}/`
            );


        const template =
            await response.json();


        if (!response.ok) {

            showMessage(
                "Unable to load template.",
                "danger"
            );

            return;
        }


        document.getElementById(
            "editTemplateId"
        ).value = template.id;


        document.getElementById(
            "editChannel"
        ).value = template.channel;


        document.getElementById(
            "editTitle"
        ).value = template.title || "";


        document.getElementById(
            "editSubject"
        ).value = template.subject || "";


        document.getElementById(
            "editBody"
        ).value = template.body || "";


        document
            .getElementById("editCard")
            .classList.remove("d-none");


        document
            .getElementById("editCard")
            .scrollIntoView({
                behavior: "smooth"
            });


    } catch (error) {

        console.error(error);

        showMessage(
            "Something went wrong while loading template.",
            "danger"
        );

    }

}



/* ================================
   SAVE EDITED TEMPLATE
================================ */

document
    .getElementById("editTemplateForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const templateId =
                document.getElementById(
                    "editTemplateId"
                ).value;


            const title =
                document.getElementById(
                    "editTitle"
                ).value;


            const subject =
                document.getElementById(
                    "editSubject"
                ).value;


            const body =
                document.getElementById(
                    "editBody"
                ).value;


            try {

                const response =
                    await fetch(
                        `/api/notifications/templates/${templateId}/`,
                        {

                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json",
                                "X-CSRFToken":
                                    csrfToken
                            },

                            body: JSON.stringify({

                                title:
                                    title,

                                subject:
                                    subject,

                                body:
                                    body,

                                is_enabled:
                                    true

                            })

                        }
                    );


                const data =
                    await response.json();


                if (response.ok) {

                    showMessage(
                        "Template updated successfully.",
                        "success"
                    );


                    document
                        .getElementById("editCard")
                        .classList.add("d-none");


                    loadTriggers();

                } else {

                    showMessage(
                        JSON.stringify(data),
                        "danger"
                    );

                }


            } catch (error) {

                console.error(error);

                showMessage(
                    "Something went wrong while updating template.",
                    "danger"
                );

            }

        }
    );



/* ================================
   CANCEL EDIT
================================ */

function cancelEdit() {

    document
        .getElementById("editCard")
        .classList.add("d-none");

}



/* ================================
   TOGGLE TEMPLATE
================================ */

async function toggleTemplate(templateId) {

    try {

        const response =
            await fetch(
                `/api/notifications/templates/${templateId}/toggle/`,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({})

                }
            );


        const data =
            await response.json();


        if (response.ok) {

            showMessage(
                "Template status updated successfully.",
                "success"
            );


            loadTriggers();

        } else {

            showMessage(
                data.message ||
                "Unable to update template.",
                "danger"
            );

        }


    } catch (error) {

        console.error(error);

        showMessage(
            "Something went wrong.",
            "danger"
        );

    }

}



/* ================================
   TEST TEMPLATE
================================ */

function testTemplate(templateId, channel) {

    document.getElementById("testTemplateId").value =
        templateId;

    document.getElementById("testChannel").value =
        channel;

    document.getElementById("testChannelDisplay").value =
        channel;


    document
        .getElementById("phoneField")
        .classList.add("d-none");

    document
        .getElementById("emailField")
        .classList.add("d-none");

    document
        .getElementById("subscriptionField")
        .classList.add("d-none");


    if (channel === "whatsapp") {

        document
            .getElementById("phoneField")
            .classList.remove("d-none");

    }


    if (channel === "email") {

        document
            .getElementById("emailField")
            .classList.remove("d-none");

    }


    if (channel === "web_push") {

        document
            .getElementById("subscriptionField")
            .classList.remove("d-none");

    }


    document
        .getElementById("testCard")
        .classList.remove("d-none");


    document
        .getElementById("testCard")
        .scrollIntoView({
            behavior: "smooth"
        });

}



document
    .getElementById("testNotificationForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const templateId =
                document.getElementById(
                    "testTemplateId"
                ).value;


            const channel =
                document.getElementById(
                    "testChannel"
                ).value;


            let requestData = {

                template_id:
                    templateId,

                channel:
                    channel

            };


            if (channel === "whatsapp") {

                requestData.phone =
                    document.getElementById(
                        "testPhone"
                    ).value;

            }


            if (channel === "email") {

                requestData.email =
                    document.getElementById(
                        "testEmail"
                    ).value;

            }


            if (channel === "web_push") {

                requestData.subscription_id =
                    document.getElementById(
                        "testSubscriptionId"
                    ).value;

            }


            try {

                const response =
                    await fetch(
                        "/api/notifications/test/",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",
                                "X-CSRFToken":
                                    csrfToken
                            },

                            body:
                                JSON.stringify(
                                    requestData
                                )

                        }
                    );


                const data =
                    await response.json();


                if (response.ok && data.success) {

                    showMessage(
                        "Test notification sent successfully.",
                        "success"
                    );

                } else {

                    showMessage(
                        data.message ||
                        JSON.stringify(data),
                        "danger"
                    );

                }


            } catch (error) {

                console.error(error);

                showMessage(
                    "Something went wrong while sending notification.",
                    "danger"
                );

            }

        }
    );



function cancelTest() {

    document
        .getElementById("testCard")
        .classList.add("d-none");

}


/* ================================
   SCROLL
================================ */

function scrollToCreateForm() {

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



/* ================================
   MESSAGE
================================ */

function showMessage(
    message,
    type
) {

    const messageBox =
        document.getElementById(
            "message"
        );


    messageBox.innerHTML = `

        <div class="alert alert-${type}">
            ${message}
        </div>

    `;


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



/* ================================
   INITIAL LOAD
================================ */

loadTriggerOptions();

loadTriggers();


</script>

</body>

</html>
